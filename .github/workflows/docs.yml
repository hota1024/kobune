name: Documentation

# `install.sh` is in the list because the site serves it: `prebuild` copies
# it into `public/`, and https://minato.1024.works/install.sh is the URL the
# README tells people to pipe into a shell. Left out, a fix to the script
# alone would never be deployed and the old one would go on being installed.
#
# The two lists are duplicated because GitHub Actions does not resolve YAML
# anchors. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'install.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'install.sh'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest

    # The Cloudflare credentials are environment secrets, so the job has to
    # name the environment or they are simply absent — which reads exactly
    # like a fork's pull request and skips the deploy without complaining.
    environment: Release

    # At job level so the deploy step's `if` can see it. A step's own `env`
    # is in scope for its `if` on paper; keeping it here removes the doubt.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    # Needed to leave the preview URL as a comment on the pull request.
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          # VitePress reads git history for each page's last-updated date.
          # A shallow clone leaves every page dated to the checkout.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # VitePress fails the build on a dead internal link, so this checks
      # the cross-references between pages as well as that it compiles.
      # It runs for every pull request, including ones from forks that
      # cannot deploy.
      - name: Build
        run: pnpm build
        working-directory: docs

      # A fork's pull request has no access to the environment's secrets, so
      # there is nothing to deploy with. The build above is still the useful
      # half.
      #
      # wrangler is a devDependency rather than something an action installs
      # for us: cloudflare/wrangler-action runs `pnpm add wrangler` mid-job,
      # and pnpm blocks workerd's install script unless it is allowed by
      # name — which is a thing to configure for a dependency that is not
      # in the lockfile. Pinning it here makes the version reproducible and
      # the install one `pnpm install`.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Any branch other than main becomes a preview deployment with its
        # own URL, which is the point of hosting the docs here: prose is
        # reviewed by reading it, not by reading its diff.
        run: >-
          pnpm deploy:pages
          --branch=${{ github.head_ref || github.ref_name }}
