name: Documentation

# `install.sh` is in the list because the site serves it: `prebuild` copies
# it into `public/`, and https://minato.1024.works/install.sh is the URL the
# README tells people to pipe into a shell. Left out, a fix to the script
# alone would never be deployed and the old one would go on being installed.
#
# `assets/**` is there for the same reason: the logo is copied into
# `public/logo/` by the same step, so a new logo reaches the site only if
# changing one builds it.
#
# The two lists are duplicated because GitHub Actions does not resolve YAML
# anchors. Keep them in step.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'install.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'install.sh'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest

    # The Cloudflare credentials are environment secrets, so the job has to
    # name the environment or they are simply absent — which reads exactly
    # like a fork's pull request and skips the deploy without complaining.
    environment: Release

    # At job level so the deploy step's `if` can see it. A step's own `env`
    # is in scope for its `if` on paper; keeping it here removes the doubt.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    # Needed to leave the preview URL as a comment on the pull request.
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # VitePress reads git history for each page's last-updated date.
          # A shallow clone leaves every page dated to the checkout.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # VitePress fails the build on a dead internal link, so this checks
      # the cross-references between pages as well as that it compiles.
      # It runs for every pull request, including ones from forks that
      # cannot deploy.
      - name: Build
        run: pnpm build
        working-directory: docs

      # A fork's pull request has no access to the environment's secrets, so
      # there is nothing to deploy with. The build above is still the useful
      # half.
      #
      # wrangler is a devDependency rather than something an action installs
      # for us: cloudflare/wrangler-action runs `pnpm add wrangler` mid-job,
      # and pnpm blocks workerd's install script unless it is allowed by
      # name — which is a thing to configure for a dependency that is not
      # in the lockfile. Pinning it here makes the version reproducible and
      # the install one `pnpm install`.
      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        # Any branch other than main becomes a preview deployment with its
        # own URL, which is the point of hosting the docs here: prose is
        # reviewed by reading it, not by reading its diff.
        run: |
          set -euo pipefail

          # Piped through `tee` rather than read from a file alone, so a
          # failed deploy is still diagnosed from this step's log instead of
          # from an empty one. `pipefail` keeps the failure from being
          # swallowed by `tee` succeeding.
          log="$RUNNER_TEMP/deploy.log"
          pnpm deploy:pages --branch="$BRANCH" | tee "$log"

          # A preview deploy prints two URLs: one naming the deployment,
          # which stays pinned to this commit, and an alias that follows the
          # branch. Both are worth having — the alias is the link to keep in
          # the pull request, the other is what to open when a comment is
          # about a revision that has since been pushed over.
          #
          # The alias comes from polling the deployment after the upload, so
          # wrangler omits it if the deployment is not ready in time. Falling
          # back to the pinned URL leaves the comment correct rather than
          # empty.
          commit_url=$(sed -n \
            's/.*Take a peek over at \(https:[^ ]*\).*/\1/p' "$log" | tail -1)
          alias_url=$(sed -n \
            's/.*Deployment alias URL: \(https:[^ ]*\).*/\1/p' "$log" | tail -1)

          {
            echo "commit-url=$commit_url"
            echo "alias-url=${alias_url:-$commit_url}"
          } >> "$GITHUB_OUTPUT"

      # Skipped when the deploy was, which covers both the pushes to main
      # that have no pull request to comment on and the forks whose
      # `GITHUB_TOKEN` is read-only anyway.
      - name: Comment the preview URL on the pull request
        if: >-
          github.event_name == 'pull_request'
          && steps.deploy.outputs.alias-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias-url }}
          COMMIT_URL: ${{ steps.deploy.outputs.commit-url }}
          # Marks the comment as this workflow's, so the next push edits it
          # instead of adding another. HTML comments do not render.
          MARKER: '<!-- docs-preview -->'
        run: |
          set -euo pipefail

          body=$(printf '%s\n' \
            "$MARKER" \
            "### 📖 Documentation preview" \
            "" \
            "- Latest: $ALIAS_URL" \
            "- This revision (\`${HEAD_SHA:0:7}\`): $COMMIT_URL" \
            "" \
            "The first follows the branch and is replaced by every push; the" \
            "second stays on the commit a review comment was written about." \
            "" \
            "The site serves the install script too, so" \
            "\`curl -fsSL $ALIAS_URL/install.sh | sh\` installs using this" \
            "branch's copy of it.")

          # One comment per pull request, edited in place: a new one on every
          # push would bury the review under links to builds nobody is
          # looking at any more.
          #
          # `env.MARKER` rather than the string inline, so the marker written
          # above is the one matched here and the two cannot drift apart.
          #
          # The first line is taken by expansion rather than by `head`, which
          # would close the pipe under `pipefail` and fail the step on a
          # pull request long enough to paginate.
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --paginate \
            --jq '.[] | select((.body // "") | startswith(env.MARKER)) | .id')
          id=${ids%%$'\n'*}

          if [ -n "$id" ]; then
            # `--silent` because the response is the whole comment, and the
            # log is more useful without a copy of what was just written.
            gh api --method PATCH --silent \
              "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              --field body="$body"
          else
            gh pr comment "$PR" --body "$body"
          fi
