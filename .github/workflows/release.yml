name: Release

on:
  push:
    branches: [main]
    # Documentation has its own workflow and cannot change a binary. Every
    # merge that only touches docs/ would otherwise rebuild and republish
    # the same artefacts.
    #
    # `**/*.md` is deliberately not here. The only markdown outside docs/ is
    # `README.md`, which is packaged into the archive, and
    # `skills/minato/SKILL.md`, which `include_str!` puts inside the binary
    # — so both change what is released, and ignoring them would leave
    # `minato skill install` writing last month's text.
    #
    # `assets/**` is the logo. It is served by the site and shown in the
    # README; nothing in it has ever been inside a binary.
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/docs.yml'

  # For rebuilding without an empty commit, after a runner-side failure.
  workflow_dispatch:

# One at a time. Two of these racing would have them overwrite each other's
# assets under the same tag, and which won would come down to timing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The rolling pre-release every merge to main replaces. Versioned releases
  # are a separate thing, cut by tagging, and do not exist yet.
  CHANNEL: nightly

jobs:
  # Targets are grouped by runner rather than one per entry. Both Apple
  # targets are built on one macOS runner: the second is a cross-compile and
  # costs about a minute, where a second matrix entry would pay for a whole
  # runner again — checkout, toolchain, cache.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: Linux
            runs-on: ubuntu-latest
            targets: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      # The desktop app is excluded: it pulls GPUI from the Zed repository,
      # and an unsigned .app is stopped by Gatekeeper on the machine it
      # reaches, so shipping one would promise more than it delivers.
      # Signing and notarisation are open in docs/DESIGN.md §15.
      - name: Build and package
        env:
          # Every nightly reports the same 0.1.0, so the binary records the
          # commit it was built from instead. `minato update` compares that
          # against the release to decide whether there is anything to do.
          MINATO_BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in ${{ matrix.targets }}; do
            cargo build --release --locked \
              --target "$target" -p minato -p minatod

            name="minato-$target"
            staging="$(mktemp -d)/$name"
            mkdir -p "$staging"

            cp "target/$target/release/minato" "$staging/"
            cp "target/$target/release/minatod" "$staging/"
            # NOTICE travels with every distribution — Apache-2.0 §4(d).
            cp LICENSE NOTICE README.md "$staging/"

            # The CLI looks next to itself for the daemon, so the two have
            # to stay in one directory. The archive keeps them together.
            tar -C "$(dirname "$staging")" -czf "dist/$name.tar.gz" "$name"

            # macOS has shasum, Linux has sha256sum. Both produce the format
            # `shasum -c` and `sha256sum -c` accept.
            ( cd dist && \
              { sha256sum "$name.tar.gz" 2>/dev/null \
                || shasum -a 256 "$name.tar.gz"; } > "$name.tar.gz.sha256" )
          done

          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Move the tag rather than deleting the release: deleting it drops
          # the download counts and leaves the URL 404 for as long as the
          # next upload takes.
          git tag --force "$CHANNEL"
          git push --force origin "refs/tags/$CHANNEL"

          notes=$(printf '%s\n' \
            "Built from \`${GITHUB_SHA}\` on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            "" \
            "The latest build of \`main\`, replaced on every merge. Not a" \
            "release: nothing here carries a version, and what it contains" \
            "changes without notice." \
            "" \
            "\`\`\`console" \
            "\$ curl -fsSL https://minato.1024.works/install.sh | sh" \
            "\`\`\`" \
            "" \
            "That picks the right archive, checks it against its \`.sha256\`," \
            "and installs shell completions. \`minato update\` replaces an" \
            "installation with whatever this tag points at." \
            "" \
            "By hand:" \
            "" \
            "\`\`\`console" \
            "\$ tar xzf minato-x86_64-unknown-linux-gnu.tar.gz" \
            "\$ cd minato-x86_64-unknown-linux-gnu && ./minato doctor" \
            "\`\`\`" \
            "" \
            "\`minato\` and \`minatod\` have to stay in the same directory:" \
            "the CLI starts the daemon by looking next to itself.")

          if gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release edit "$CHANNEL" \
              --target "$GITHUB_SHA" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$CHANNEL" \
              --target "$GITHUB_SHA" \
              --title "main (rolling)" \
              --notes "$notes" \
              --prerelease
          fi

          # --clobber so a rerun replaces assets instead of failing on them.
          gh release upload "$CHANNEL" artifacts/* --clobber
