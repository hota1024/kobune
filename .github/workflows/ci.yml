name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing here and turn "a test failed" into something
  # that can be acted on without re-running locally.
  RUST_BACKTRACE: 1

jobs:
  # Everything but the desktop app. Fast, and the signal that matters for
  # almost every change.
  #
  # Both platforms: macOS is what the project targets, and Linux is where
  # the differences show up. Reading a closed socket gives EOF on one and
  # ECONNRESET on the other, and a test that raced on process-global state
  # only ever failed under Linux's scheduling. Neither would have been
  # noticed on macOS alone.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # One platform is enough for formatting; it cannot differ.
      - name: Formatting
        if: matrix.os == 'macos-latest'
        run: cargo fmt --all --check

      # Nor can the dependency graph. `docs/DESIGN.md` §13: no client-side
      # crate may reach `minato-runtime` and its neighbours, or Docker
      # ends up in the GUI and the daemon stops being the only way in.
      - name: Direction of dependencies
        if: matrix.os == 'macos-latest'
        run: cargo xtask deps check

      # `minato-desktop` is excluded here and built in its own job: it pulls
      # GPUI from the Zed repository, which dominates the build time and
      # would delay the result for changes that cannot affect it.
      - name: Clippy
        run: cargo clippy --workspace --exclude minato-desktop --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude minato-desktop

  # The tests that need a container runtime, which is why they are their
  # own job: every one of them is `#[ignore]`d, so the job above never
  # runs them and stays as fast as it was.
  #
  # Ubuntu because Docker is already installed there. The macOS runners
  # have no container runtime at all, and nothing in these tests is
  # platform-specific — the runtime is reached through its API.
  #
  # This is where the gap `docs/DESIGN.md` §6 describes gets closed: the
  # Docker backend is most of two thousand lines whose only other tests
  # parse fixtures written by hand, which is exactly the arrangement that
  # let M0's Apple Container backend be wholly broken while its tests
  # passed.
  runtime:
    name: Runtime (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pulled here rather than inside a test, so a slow registry shows up
      # as a slow step instead of a start that looks like it hung.
      - name: Fetch the image the tests run
        run: docker pull busybox:latest

      # One at a time: they share a Docker daemon, and each names its
      # containers after the project in its own `minato.toml`.
      - name: Tests
        run: cargo test --workspace --exclude minato-desktop -- --ignored --test-threads=1

      # A container left behind would be found by the next run and read as
      # state that belongs to it. The harness clears up after itself even
      # when a test panics; this is the answer if that ever stops being
      # true, and it says so rather than passing quietly.
      - name: Nothing left behind
        run: |
          left="$(docker ps -aq --filter 'label=dev.minato.managed=1')"
          if [ -n "$left" ]; then
            echo "containers survived the run:" >&2
            docker ps -a --filter 'label=dev.minato.managed=1' >&2
            exit 1
          fi

  # The written half. `.claude/skills/prose/` says what the house style is
  # and this is what holds the repository to it — column width, the
  # Japanese typographic rules, the English ones, English against Japanese
  # page for page, and every `#anchor` that names a heading.
  #
  # Here rather than in `docs.yml`, which is filtered to the paths that
  # build the site. The corpus is wider than the site: `README.md`,
  # `SECURITY.md` and `skills/minato/SKILL.md` are all in it, and none of
  # them should trigger a deploy.
  #
  # Node with nothing installed — the checker has no dependencies, which is
  # most of why it can run here for a couple of seconds.
  prose:
    name: Prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Style
        run: node .claude/skills/prose/scripts/check.mjs

  # The GUI, on its own because of the GPUI dependency. Slow on a cold
  # cache — the Zed checkout alone is large.
  desktop:
    name: Desktop app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache: sharing one with the `rust` job would have each
          # evict the other's artefacts.
          key: desktop

      # If bindgen cannot find the system frameworks, a clang that does not
      # know about macOS is first on PATH. Setting LIBCLANG_PATH to the
      # Command Line Tools is the fix; runners have not needed it so far.
      - name: Clippy
        run: cargo clippy -p minato-desktop --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p minato-desktop
