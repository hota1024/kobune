[package]
name = "kobune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kobune"
path = "src/main.rs"

[dependencies]
kobune-core.workspace = true
kobune-api.workspace = true
kobune-client.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete.workspace = true
ratatui.workspace = true
qrcode.workspace = true
# To tell a wide glyph's cells apart when a drawn buffer is written out.
# ratatui's own backends count columns with it for the same reason.
unicode-width = "0.2"
serde_json.workspace = true
libc.workspace = true
dirs.workspace = true
reqwest.workspace = true
sha2.workspace = true
chrono.workspace = true
tar = "0.4"
flate2 = "1"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
