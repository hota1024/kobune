[package]
name = "minato-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minato-core.workspace = true
minato-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "net", "io-util"] }
tokio-stream = { workspace = true, features = ["sync"] }
# For `openpty`. Apple Container will only attach to a real terminal, so
# the daemon has to open one — see `terminal.rs`.
libc.workspace = true
futures.workspace = true
async-trait.workspace = true
bollard.workspace = true
# To read a container's start time out of what Docker reports, which is
# RFC 3339 — see `terminal_modes`.
chrono.workspace = true
tar = "0.4"
shell-words.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
