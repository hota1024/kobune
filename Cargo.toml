[workspace]
resolver = "3"
members = [
    "crates/minato-core",
    "crates/minato-api",
    "crates/minato-client",
    "crates/minato-runtime",
    "crates/minato-proxy",
    "crates/minato-dns",
    "crates/minato-tunnel",
    "apps/daemon",
    "apps/cli",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hota1024/minato"

[workspace.dependencies]
# Internal crates. For the direction of dependencies, see docs/DESIGN.md §13.
minato-core = { path = "crates/minato-core" }
minato-api = { path = "crates/minato-api" }
minato-client = { path = "crates/minato-client" }
minato-runtime = { path = "crates/minato-runtime" }
minato-proxy = { path = "crates/minato-proxy" }
minato-dns = { path = "crates/minato-dns" }
minato-tunnel = { path = "crates/minato-tunnel" }

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialisation and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
humantime-serde = "1"
humantime = "2"

# Utilities
sha2 = "0.10"
shell-words = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
time = "0.3"

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Networking
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
axum = "0.8"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
hickory-server = "0.24"
hickory-proto = "0.24"

# Runtime
bollard = "0.18"

# GUI
#
# gpui and gpui-component are not on crates.io, so they come from git.
#
# **Do not pin a rev on gpui.** gpui-component refers to gpui without one,
# and pinning it here alone makes it a different source, putting two copies
# of gpui in the dependency graph. Their trait implementations then disagree,
# and it surfaces as an inscrutable "no method `Styled`" error.
# The actual revision is pinned by Cargo.lock.
#
# runtime_shaders compiles shaders at run time. The default calls the Metal
# compiler during the build, which needs a full Xcode; this way a machine with
# only the Command Line Tools can build it.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576ee704b48476f6782962690e0feb7985b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576ee704b48476f6782962690e0feb7985b" }
tray-icon = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
