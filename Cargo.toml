[workspace]
resolver = "3"
members = [
    "crates/kobune-core",
    "crates/kobune-api",
    "crates/kobune-client",
    "crates/kobune-runtime",
    "crates/kobune-proxy",
    "crates/kobune-dns",
    "crates/kobune-tunnel",
    "apps/daemon",
    "apps/cli",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 is what edition 2024 needs. It is 1.88 because ratatui asks for it,
# and the CLI draws everything it prints with ratatui.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/hota1024/kobune"

[workspace.dependencies]
# Internal crates. For the direction of dependencies, see docs/DESIGN.md §13.
kobune-core = { path = "crates/kobune-core" }
kobune-api = { path = "crates/kobune-api" }
kobune-client = { path = "crates/kobune-client" }
kobune-runtime = { path = "crates/kobune-runtime" }
kobune-proxy = { path = "crates/kobune-proxy" }
kobune-dns = { path = "crates/kobune-dns" }
kobune-tunnel = { path = "crates/kobune-tunnel" }

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialisation and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
# Compose files, for `kobune init --from-compose`. A parser rather than a
# `serde` mapping on purpose: the point of that command is to name every
# key it did not convert, and a struct either ignores unknown keys
# silently or refuses the whole file. Walking the document is what lets it
# report. `serde_yaml` is deprecated and `serde_yml` carries an unsoundness
# advisory; this one has neither.
yaml-rust2 = "0.11"
indexmap = { version = "2", features = ["serde"] }
# Terminal traffic is bytes, and the wire format is one JSON document per
# line. Base64 is what carries the one inside the other.
base64 = "0.22"
humantime-serde = "1"
humantime = "2"

# Utilities
libc = "0.2"
sha2 = "0.10"
shell-words = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
time = "0.3"

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Terminal drawing. Everything the CLI shows a person is a ratatui widget,
# so the same views can be hung in a full-screen TUI later without being
# written twice (`docs/DESIGN.md` §3).
#
# The crossterm backend comes with it; there is no separate dependency to
# keep in step (ratatui re-exports it as `ratatui::crossterm`).
ratatui = "0.30"

# `kobune url --qr`. The encoder only — the default features add PNG and
# SVG writers, and what this needs is the module grid, which it draws with
# ratatui like everything else the CLI shows.
qrcode = { version = "0.14", default-features = false }

# Networking
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
axum = "0.8"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
# **Directly, not through rcgen.** 0.14 stopped exposing any way to read a
# certificate's name constraints back: `CertificateParams::from_ca_cert_der`
# went `pub(crate)`, and the `Issuer` that replaced it keeps the signing key
# and the distinguished name and drops the constraints. Reading them is how
# `kobune doctor` tells a CA made under the rule from one made before it, so
# it now parses the certificate here — which is where rcgen was reading them
# from anyway. Kept in step with rcgen's own x509-parser to avoid two copies.
x509-parser = "0.18"
hickory-server = "0.24"
hickory-proto = "0.24"

# Runtime
bollard = "0.18"

# HTTP client, for the update check. rustls rather than the system TLS:
# the proxy already depends on it, so nothing new is pulled in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

# GUI
#
# gpui and gpui-component are not on crates.io, so they come from git.
#
# **Do not pin a rev on gpui.** gpui-component refers to gpui without one,
# and pinning it here alone makes it a different source, putting two copies
# of gpui in the dependency graph. Their trait implementations then disagree,
# and it surfaces as an inscrutable "no method `Styled`" error.
# The actual revision is pinned by Cargo.lock.
#
# runtime_shaders compiles shaders at run time. The default calls the Metal
# compiler during the build, which needs a full Xcode; this way a machine with
# only the Command Line Tools can build it.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576ee704b48476f6782962690e0feb7985b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576ee704b48476f6782962690e0feb7985b" }
tray-icon = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
