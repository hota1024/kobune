[workspace]
resolver = "3"
members = [
    "crates/minato-core",
    "crates/minato-api",
    "crates/minato-client",
    "crates/minato-runtime",
    "crates/minato-proxy",
    "crates/minato-dns",
    "crates/minato-tunnel",
    "apps/daemon",
    "apps/cli",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hota1024/minato"

[workspace.dependencies]
# 内部 crate。依存の方向は docs/DESIGN.md §13 を参照。
minato-core = { path = "crates/minato-core" }
minato-api = { path = "crates/minato-api" }
minato-client = { path = "crates/minato-client" }
minato-runtime = { path = "crates/minato-runtime" }
minato-proxy = { path = "crates/minato-proxy" }
minato-dns = { path = "crates/minato-dns" }
minato-tunnel = { path = "crates/minato-tunnel" }

# 非同期
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# シリアライズ・設定
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
humantime-serde = "1"
humantime = "2"

# ユーティリティ
sha2 = "0.10"
shell-words = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
time = "0.3"

# エラー・ログ
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# ネットワーク
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
axum = "0.8"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
hickory-server = "0.24"
hickory-proto = "0.24"

# Runtime
bollard = "0.18"

# GUI
#
# gpui / gpui-component は crates.io に無いため git から取る。
#
# **gpui に rev を指定しない。** gpui-component 側が rev 無しで gpui を
# 参照しており、こちらだけ固定すると別ソース扱いになって gpui が 2 つ
# 依存グラフに入る。トレイトの実装が食い違い、`Styled` のメソッドが
# 見つからないという分かりにくいエラーになる。
# 実際の版は Cargo.lock で固定される。
#
# runtime_shaders はシェーダを実行時にコンパイルする。既定ではビルド時に
# Metal コンパイラを呼ぶが、それは完全な Xcode が要る。Command Line Tools
# だけの環境でもビルドできるようにこちらを使う。
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576ee704b48476f6782962690e0feb7985b" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f96f1576ee704b48476f6782962690e0feb7985b" }
tray-icon = "0.19"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
